services:
  postgres:
    image: postgres:16
    container_name: cyber-implant-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cyberimplant
      POSTGRES_PASSWORD: cyberimplant
      POSTGRES_DB: cyberimplant
    ports:
      # Host port 5433, not 5432: this machine already runs a native
      # Windows PostgreSQL service bound to 5432 (see docs/context/04-database.md).
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Lab3: creates cyberimplant_sandbox + cyberimplant_prod on a fresh volume.
      - ./config/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cyberimplant"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: cyber-implant-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@cyberimplant.dev
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./config/pgadmin-servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  pgadmin_data:
